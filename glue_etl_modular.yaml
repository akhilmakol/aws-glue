# README.md
# Glue ETL Project (Modularized)

This project demonstrates a modular ETL job using AWS Glue and PySpark, with clear separation of concerns across extract, transform, and load stages.

## 📁 Folder Structure
```
glue_etl_project/
├── config.py
├── glue_job.py
├── extract/
│   └── s3_reader.py
├── transform/
│   ├── data_cleaning.py
│   └── data_enrichment.py
├── load/
│   └── s3_writer.py
├── tests/
│   └── test_transform.py
├── conftest.py
├── requirements.txt
├── README.md
├── .gitignore
├── Makefile
├── cfn_glue_etl.yml
└── terraform/
    └── main.tf
```

## 🚀 How to Run

1. **Install dependencies:**
```bash
pip install -r requirements.txt
```

2. **Run locally with PySpark:**
```bash
export INPUT_PATH="s3://your-bucket/input/"
export OUTPUT_PATH="s3://your-bucket/output/"
python glue_job.py
```

3. **Run tests:**
```bash
pytest tests/
```

## ☁️ Deploy with AWS CloudFormation
Use `cfn_glue_etl.yml` to deploy Glue Job and supporting resources. Example:
```bash
aws cloudformation deploy \
  --template-file cfn_glue_etl.yml \
  --stack-name glue-etl-stack \
  --capabilities CAPABILITY_IAM \
  --parameter-overrides \
    InputS3Path=s3://your-bucket/input/ \
    OutputS3Path=s3://your-bucket/output/ \
    ScriptLocation=s3://your-bucket/glue_etl_project/glue_job.py
```

## ☁️ Deploy with Terraform
```bash
cd terraform
terraform init
terraform apply -var input_s3_path="s3://your-bucket/input/" \
                -var output_s3_path="s3://your-bucket/output/" \
                -var script_location="s3://your-bucket/glue_etl_project/glue_job.py"
```

## 🧹 Make Targets
```bash
make install         # Install Python dependencies
make test            # Run all PyTest unit tests
make clean           # Remove __pycache__ and test cache
make deploy-cfn      # Deploy stack using CloudFormation
make deploy-tf       # Deploy stack using Terraform
```

## 🔍 Features
- Modular Python structure for ETL steps
- Pytest-based unit tests
- Environment-configurable S3 paths
- Compatible with AWS Glue Jobs or local PySpark

