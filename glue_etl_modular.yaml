# Makefile
.PHONY: install test clean deploy-cfn deploy-tf

install:
	pip install -r requirements.txt

test:
	pytest tests/

clean:
	find . -type d -name "__pycache__" -exec rm -r {} +
	rm -rf .pytest_cache .cache

deploy-cfn:
	aws cloudformation deploy \
		--template-file cfn_glue_etl.yml \
		--stack-name glue-etl-stack \
		--capabilities CAPABILITY_IAM \
		--parameter-overrides \
			InputS3Path=s3://your-bucket/input/ \
			OutputS3Path=s3://your-bucket/output/ \
			ScriptLocation=s3://your-bucket/glue_etl_project/glue_job.py

deploy-tf:
	cd terraform && terraform init && terraform apply \
		-var input_s3_path="s3://your-bucket/input/" \
		-var output_s3_path="s3://your-bucket/output/" \
		-var script_location="s3://your-bucket/glue_etl_project/glue_job.py"


# cfn_glue_etl.yml
AWSTemplateFormatVersion: '2010-09-09'
Description: Glue ETL Job with modular Python code

Parameters:
  InputS3Path:
    Type: String
  OutputS3Path:
    Type: String
  ScriptLocation:
    Type: String
  GlueRoleName:
    Type: String
    Default: GlueETLJobRole

Resources:
  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref GlueRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ModularETLJob
      Role: !GetAtt GlueRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Ref ScriptLocation
        PythonVersion: 3
      DefaultArguments:
        --TempDir: !Sub 's3://aws-glue-temporary-${AWS::AccountId}-${AWS::Region}/temp/'
        --INPUT_PATH: !Ref InputS3Path
        --OUTPUT_PATH: !Ref OutputS3Path
      GlueVersion: "4.0"
      NumberOfWorkers: 2
      WorkerType: G.1X


# terraform/main.tf
provider "aws" {
  region = "us-east-1"
}

variable "input_s3_path" {}
variable "output_s3_path" {}
variable "script_location" {}

resource "aws_iam_role" "glue_role" {
  name = "GlueETLJobRole"
  assume_role_policy = jsonencode({
    Version = "2012-10-17"
    Statement = [{
      Action = "sts:AssumeRole"
      Principal = {
        Service = "glue.amazonaws.com"
      }
      Effect = "Allow"
    }]
  })
}

resource "aws_iam_role_policy_attachment" "glue_policy" {
  role       = aws_iam_role.glue_role.name
  policy_arn = "arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole"
}

resource "aws_iam_role_policy_attachment" "s3_policy" {
  role       = aws_iam_role.glue_role.name
  policy_arn = "arn:aws:iam::aws:policy/AmazonS3FullAccess"
}

resource "aws_glue_job" "modular_etl" {
  name     = "ModularETLJob"
  role_arn = aws_iam_role.glue_role.arn

  command {
    name            = "glueetl"
    script_location = var.script_location
    python_version  = "3"
  }

  default_arguments = {
    "--TempDir"     = "s3://aws-glue-temporary-${data.aws_caller_identity.current.account_id}-${data.aws_region.current.name}/temp/"
    "--INPUT_PATH"  = var.input_s3_path
    "--OUTPUT_PATH" = var.output_s3_path
  }

  glue_version     = "4.0"
  number_of_workers = 2
  worker_type       = "G.1X"
}

data "aws_caller_identity" "current" {}
data "aws_region" "current" {}
