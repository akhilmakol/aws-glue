# glue_job.py

import sys
from awsglue.utils import getResolvedOptions
from extract.s3_reader import read_s3_data
from transform.data_cleaning import clean_data
from transform.data_enrichment import enrich_data
from load.s3_writer import write_to_s3

from awsglue.context import GlueContext
from pyspark.context import SparkContext

from config import INPUT_PATH, OUTPUT_PATH

sc = SparkContext()
glueContext = GlueContext(sc)
spark = glueContext.spark_session


def main():
    # Step 1: Extract
    df_raw = read_s3_data(glueContext, INPUT_PATH)

    # Step 2: Transform
    df_clean = clean_data(df_raw)
    df_final = enrich_data(df_clean)

    # Step 3: Load
    write_to_s3(df_final, OUTPUT_PATH)


if __name__ == "__main__":
    main()


# extract/s3_reader.py

def read_s3_data(glueContext, path):
    return glueContext.create_dynamic_frame.from_options(
        connection_type="s3",
        connection_options={"paths": [path]},
        format="parquet"
    ).toDF()


# transform/data_cleaning.py

def clean_data(df):
    return df.dropna().dropDuplicates()


# transform/data_enrichment.py

from pyspark.sql.functions import current_timestamp

def enrich_data(df):
    return df.withColumn("processed_time", current_timestamp())


# load/s3_writer.py

def write_to_s3(df, output_path):
    df.write.mode("overwrite").parquet(output_path)


# tests/test_transform.py

def test_clean_data(spark_session):
    from transform.data_cleaning import clean_data
    df = spark_session.createDataFrame([
        (1, "Alice"),
        (2, None),
        (1, "Alice")
    ], ["id", "name"])
    cleaned = clean_data(df)
    assert cleaned.count() == 1

def test_enrich_data(spark_session):
    from transform.data_enrichment import enrich_data
    df = spark_session.createDataFrame([(1, "Alice")], ["id", "name"])
    enriched = enrich_data(df)
    assert "processed_time" in enriched.columns


